map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTML needs to arrive uncompressed for the locale bootstrap.
map $http_accept $upstream_accept_encoding {
    default     $http_accept_encoding;
    ~*text/html "";
}

# Resolve the gateway again if Compose recreates its container.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream gateway {
    zone gateway 64k;
    server sub2api:8080 resolve;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 256m;
    root /usr/share/nginx/html;

    location = / { try_files /index.html =404; }
    location = /home { try_files /index.html =404; }
    location /portal-assets/ { try_files $uri =404; }

    location / {
        proxy_pass http://gateway;
        proxy_set_header Accept-Encoding $upstream_accept_encoding;
        sub_filter '</head>' '<script src="/portal-assets/locale.js"></script></head>';
        sub_filter '<title>Sub2API - AI API Gateway</title>' '<title>模型港 · AI API 中转站</title>';
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
