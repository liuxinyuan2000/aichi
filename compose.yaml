services:
  portal:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      sub2api:
        condition: service_healthy

  sub2api:
    image: weishaw/sub2api:0.2.24@sha256:c1acdd4cd1c328e6df20e513944d72fff641d4ae8c07d207458156c97c74784a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: modelport
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?请先配置 .env}
      DATABASE_DBNAME: modelport
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请先配置 .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?请先配置 .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先配置 .env}
      JWT_SECRET: ${JWT_SECRET:?请先配置 .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?请先配置 .env}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "false"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "false"
      TZ: Asia/Shanghai
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 6s
      retries: 30

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先配置 .env}
      POSTGRES_DB: modelport
      PGDATA: /var/lib/postgresql/data
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "modelport", "-d", "modelport"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请先配置 .env}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  app_data:
  database:
  cache:
